<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/css/fonts.css?v=20261014a">
<link rel="stylesheet" href="../../assets/css/crm.css?v=20261014a">
<script defer src="../../assets/js/branding.js?v=20261014a"></script>
</head>
<body data-base="../" data-active="admin-financeiro" data-title="Financeiro" data-crumbs="CRM Solua / Administração">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">


      <div class="kpis" id="finKpis"></div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-hd">
          <h3>Contas a pagar e a receber</h3>
          <span class="badge neutro">lançamentos manuais</span>
        </div>
        <div class="card-bd">
          <div id="contaResumo"></div>
          <div id="contaForm" style="margin-bottom:20px"></div>
          <div id="contaList"></div>
        </div>
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-hd"><h3>Vendas por produto</h3></div>
          <div class="card-bd"><div class="barchart" id="finProdutoBars"></div></div>
        </div>
        <div class="card">
          <div class="card-hd"><h3>Últimos 6 meses</h3></div>
          <div class="card-bd"><div class="barchart" id="finMesesBars"></div></div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-hd">
          <h3>Ranking por consultor</h3>
          <button class="btn ghost sm" id="btnExportarCsv">Exportar CSV</button>
        </div>
        <div class="card-bd" style="padding:0">
          <div class="tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Consultor</th><th>Produto(s)</th><th>Negócios fechados</th><th>Total vendido</th><th>Comissão estimada</th></tr></thead>
              <tbody id="finRanking"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../../assets/js/crm-data.js?v=20261014a"></script>
<script src="../../assets/js/crm-ui.js?v=20261014a"></script>
<script>
window.SoluaUI.requirePermission("admin-financeiro");
</script>
<script src="../../assets/js/crm-financeiro.js?v=20261014a"></script>
</body>
</html>
