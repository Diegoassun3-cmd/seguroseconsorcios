<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Disparos — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/css/fonts.css?v=20261014a">
<link rel="stylesheet" href="../../assets/css/crm.css?v=20261014a">
<script defer src="../../assets/js/branding.js?v=20261014a"></script>
</head>
<body data-base="../" data-active="admin-disparos" data-title="Central de Disparos" data-crumbs="CRM Solua / Administração">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="kpis" id="dispKpis"></div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-hd">
          <h3>Automações</h3>
          <a class="btn ghost sm" href="personalizacao.html">Configurar</a>
        </div>
        <div class="card-bd">
          <div id="automacaoLista"></div>
        </div>
      </div>


      <div class="filterbar">
        <span class="pill on" data-canalfiltro="todos">Todos</span>
        <span class="pill" data-canalfiltro="email">✉️ E-mail</span>
        <span class="pill" data-canalfiltro="whatsapp">💬 WhatsApp</span>
        <span class="spacer"></span>
        <button class="btn sm" id="btnNovaCampanha">+ Nova campanha</button>
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Campanha</th><th>Canal</th><th>Público</th><th>Status</th><th>Resultado</th><th>Data</th><th></th></tr></thead>
          <tbody id="campRows"></tbody>
        </table>
      </div>
      <p id="campEmpty" class="empty" style="display:none">Nenhuma campanha ainda.</p>

    </main>
  </div>
</div>

<!-- Modal: composer de campanha -->
<div class="overlay modal-center" id="composerOverlay">
  <div class="modal" style="width:min(680px,94vw)">
    <div class="modal-hd"><h3 style="font-size:16px">Nova campanha</h3><button class="x" data-close-overlay="composerOverlay"></button></div>
    <div class="modal-bd">
      <div class="mini-steps" id="wizSteps"><div></div><div></div><div></div><div></div></div>
      <div id="wizBody"></div>
    </div>
    <div class="modal-ft">
      <button class="btn ghost sm" id="wizBack">← Voltar</button>
      <span class="spacer"></span>
      <button class="btn sm" id="wizNext">Continuar</button>
    </div>
  </div>
</div>

<!-- Modal: detalhe de campanha -->
<div class="overlay modal-center" id="detailOverlay">
  <div class="modal" style="width:min(560px,94vw)">
    <div class="modal-hd"><h3 style="font-size:16px">Detalhe da campanha</h3><button class="x" data-close-overlay="detailOverlay"></button></div>
    <div class="modal-bd" id="detailBody"></div>
  </div>
</div>

<script src="../../assets/js/crm-data.js?v=20261014a"></script>
<script src="../../assets/js/crm-ui.js?v=20261014a"></script>
<script>
window.SoluaUI.requirePermission("admin-disparos");
document.getElementById("campEmpty").innerHTML = window.SoluaUI.emptyState('Nenhuma campanha ainda.');
</script>
<script src="../../assets/js/crm-disparos.js?v=20261014a"></script>
</body>
</html>
