<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/css/fonts.css?v=20261001b">
<link rel="stylesheet" href="../../assets/css/crm.css?v=20261001b">
<script defer src="../../assets/js/branding.js?v=20261001b"></script>
</head>
<body data-base="../" data-active="admin-equipe" data-title="Equipe" data-crumbs="CRM Solua / Administração">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="kpis" id="eqKpis"></div>

      <div class="card">
        <div class="card-hd">
          <div><h3>Membros da equipe</h3><p class="sub">Quem acessa o CRM, onde atua e a quais telas administrativas tem acesso</p></div>
          <div class="card-tools">
            <label class="card-search"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17 17l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="eqBusca" placeholder="Buscar por nome ou e-mail"></label>
            <select class="card-select" id="eqFiltro" aria-label="Filtrar por papel">
              <option value="">Todos os papéis</option>
              <option value="Administrador">Administradores</option>
              <option value="consultor">Consultores</option>
              <option value="inativo">Inativos</option>
            </select>
            <button class="btn dark" id="btnNovoUsuario" style="height:40px;padding:0 18px;font-size:13px">+ Novo usuário</button>
          </div>
        </div>
        <div class="card-bd">
          <div class="tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Usuário</th><th>Papel</th><th>Atua em</th><th>Acesso</th><th>Status</th><th>Leads</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="overlay modal-center" id="editorOverlay">
  <div class="modal" style="width:min(520px,94vw)">
    <div class="modal-hd"><h3 style="font-size:16px" id="modalTitle">Novo usuário</h3><button class="x" data-close-overlay="editorOverlay"></button></div>
    <div class="modal-bd" id="editorBody"></div>
    <div class="modal-ft"><button class="btn ghost sm" data-close-overlay="editorOverlay">Cancelar</button><button class="btn sm" id="btnSalvarUsuario">Salvar</button></div>
  </div>
</div>

<script src="../../assets/js/crm-data.js?v=20261001b"></script>
<script src="../../assets/js/crm-ui.js?v=20261001b"></script>
<script>
window.SoluaUI.requirePermission("admin-equipe");
</script>
<script src="../../assets/js/crm-equipe.js?v=20261001b"></script>
</body>
</html>
