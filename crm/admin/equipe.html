<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/crm.css">
</head>
<body data-base="../" data-active="admin-equipe" data-title="Equipe" data-crumbs="CRM Solua / Administração">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="filterbar">
        <span style="font-size:13px;color:var(--tinta-60)">Gerencie quem tem acesso ao CRM e a distribuição automática de novos leads.</span>
        <span class="spacer"></span>
        <button class="btn sm" id="btnNovoUsuario">+ Novo usuário</button>
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Usuário</th><th>Papel</th><th>Atua em</th><th>Status</th><th>Leads atribuídos</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div class="overlay modal-center" id="editorOverlay">
  <div class="modal" style="width:min(520px,94vw)">
    <div class="modal-hd"><h3 style="font-size:16px" id="modalTitle">Novo usuário</h3><button class="x" data-close-overlay="editorOverlay"></button></div>
    <div class="modal-bd" id="editorBody"></div>
    <div class="modal-ft"><button class="btn ghost sm" data-close-overlay="editorOverlay">Cancelar</button><button class="btn sm" id="btnSalvarUsuario">Salvar</button></div>
  </div>
</div>

<script src="../../assets/js/crm-data.js"></script>
<script src="../../assets/js/crm-ui.js"></script>
<script>
if(!window.SoluaUI.isAdmin){ window.SoluaUI.toast("Acesso restrito à administração.","err"); location.replace("../dashboard.html"); }
</script>
<script src="../../assets/js/crm-equipe.js"></script>
</body>
</html>
