<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/crm.css">
<script defer src="../assets/js/branding.js"></script>
</head>
<body data-base="./" data-active="dashboard" data-title="Dashboard" data-crumbs="CRM Solua">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-hd" id="pageHd"></div>

      <div class="dash-row1">
        <div class="card saldo"><div class="card-bd" style="padding-top:20px" id="saldo"></div></div>
        <div class="card kpi-wrap"><div class="kpis no-card" id="kpis"></div></div>
        <div class="card fill">
          <div class="card-hd"><div><h3>Novos leads</h3><p class="sub">Entrada por produto nos últimos 14 dias</p></div></div>
          <div class="card-bd"><div class="inner-box" id="trendChart"></div></div>
        </div>
      </div>

      <div class="dash-row2">
        <div class="dash-col">
          <div class="card">
            <div class="card-hd"><h3>Distribuição da base</h3></div>
            <div class="card-bd"><div class="barchart" id="splitBars"></div></div>
          </div>
          <div class="card">
            <div class="card-hd">
              <h3>Próximos contatos</h3>
              <a class="btn soft sm" href="calendario.html">Ver calendário</a>
            </div>
            <div class="card-bd"><div class="agenda" id="agenda"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">
            <h3>Atividade recente</h3>
            <div class="card-tools">
              <label class="card-search"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17 17l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="feedBusca" placeholder="Buscar"></label>
              <select class="card-select" id="feedFiltro" aria-label="Filtrar por tipo">
                <option value="">Todos os tipos</option>
                <option value="lead_criado">Lead criado</option>
                <option value="estagio_alterado">Mudança de etapa</option>
                <option value="nota">Nota</option>
                <option value="campanha_enviada">Campanha</option>
                <option value="automacao">Automação</option>
                <option value="usuario_login">Acesso</option>
              </select>
            </div>
          </div>
          <div class="card-bd">
            <div class="tbl-wrap">
              <table class="tbl" style="min-width:620px">
                <thead><tr><th>Responsável</th><th>Atividade</th><th>Tipo</th><th>Quando</th></tr></thead>
                <tbody id="feed"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          <div><h3>Mural de avisos</h3><p class="sub">Visível pra toda a equipe</p></div>
        </div>
        <div class="card-bd">
          <div class="mural-form" id="muralForm"></div>
          <div class="mural-list" id="muralList"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/crm-data.js"></script>
<script src="../assets/js/crm-ui.js"></script>
<script src="../assets/js/crm-leaddrawer.js"></script>
<script>
const DB = window.SoluaDB;
const iconFor = t=>({lead_criado:"👤",estagio_alterado:"↗️",nota:"📝",campanha_enviada:"📣",usuario_login:"🔑",automacao:"🤖"}[t]||"•");

// ícones simples (mesma linha visual dos outros SVGs à mão do site: stroke,
// sem preenchimento) — um por KPI, só decorativo
const KPI_ICOS = {
  funil: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>`,
  cifrao: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M16 7.5c0-1.9-1.8-3-4-3s-4 1.1-4 2.8c0 3.7 8 1.9 8 5.7 0 1.7-1.8 3-4 3s-4-1.1-4-3"/></svg>`,
  camadas: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>`,
  xis: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`,
  novo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="8" r="3.4"/><path d="M3.5 19.5c.7-3.6 3.4-5.8 6.5-5.8 1.2 0 2.3.3 3.3.9M18 14v6M15 17h6"/></svg>`
};

// resolve o consultor por trás de uma atividade (via o lead ligado a ela, ou
// direto quando a própria atividade já é de um usuário) pra mostrar o avatar
// de verdade — sem inventar autor pra atividades sem um responsável claro
function usuarioPara(a){
  if(a.leadId){ const lead = DB.getLead(a.leadId); if(lead && lead.consultorId) return DB.getUsuario(lead.consultorId); }
  else if(a.usuarioId){ return DB.getUsuario(a.usuarioId); }
  return null;
}
function avatarPara(a){
  const user = usuarioPara(a);
  if(user) return `<span class="avatar" style="background:${user.avatarBg||"#004BA5"}">${DB.iniciais(user.nome)}</span>`;
  return `<span class="avatar" style="background:var(--app-bg);color:var(--tinta-45)">${iconFor(a.tipo)}</span>`;
}

// cores de produto na MESMA ordem validada (Imóveis, Seguros, Consórcios —
// pares vizinhos checados com o validador de paleta, inclusive no empilhado)
const PRODUTOS = [
  {key:"imovel",    label:"Imóveis",    cor:"var(--roxo-vivo)", href:"pipeline-imoveis.html",    ganho:"fechado"},
  {key:"seguro",    label:"Seguros",    cor:"var(--azul)",      href:"pipeline-seguros.html",    ganho:"apolice"},
  {key:"consorcio", label:"Consórcios", cor:"var(--amarelo)",   href:"pipeline-consorcios.html", ganho:"contemplado", hach:true}
];
const TIPO_ATIV = {
  lead_criado:{label:"Lead criado", cls:"info"},
  estagio_alterado:{label:"Mudança de etapa", cls:"ok"},
  nota:{label:"Nota", cls:"aviso"},
  campanha_enviada:{label:"Campanha", cls:"roxo"},
  automacao:{label:"Automação", cls:"cinza"},
  usuario_login:{label:"Acesso", cls:"cinza"}
};

// ---------- Mural de avisos (compartilhado, visível pra toda a equipe) ----------
function renderMuralForm(){
  const me = DB.currentUser();
  document.getElementById("muralForm").innerHTML = `
    <div class="field" style="margin-bottom:10px">
      <textarea id="muralTexto" rows="2" placeholder="Escreva um aviso ou anotação pra equipe…"></textarea>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tinta-60);cursor:pointer">
        <input type="checkbox" id="muralFixar" style="width:15px;height:15px;accent-color:var(--azul)"> Fixar no topo
      </label>
      <span class="spacer"></span>
      <button class="btn sm" id="btnPublicarAviso">Publicar aviso</button>
    </div>`;
  document.getElementById("btnPublicarAviso").onclick = ()=>{
    const campo = document.getElementById("muralTexto");
    const texto = campo.value.trim();
    if(!texto) return;
    DB.addAviso({texto, autorId: me?me.id:null, fixado: document.getElementById("muralFixar").checked});
    campo.value = "";
    document.getElementById("muralFixar").checked = false;
    renderMuralList();
    window.SoluaUI.toast("Aviso publicado pra equipe.","ok");
  };
}
function renderMuralList(){
  const me = DB.currentUser();
  const avisos = DB.getAvisos();
  const el = document.getElementById("muralList");
  if(!avisos.length){
    el.innerHTML = `<div class="empty" style="padding:16px 10px">${window.SoluaUI.emptyState("Nenhum aviso ainda — seja o primeiro a publicar algo pra equipe.")}</div>`;
    return;
  }
  el.innerHTML = avisos.map(a=>{
    const autor = a.autorId ? DB.getUsuario(a.autorId) : null;
    const avatar = autor
      ? `<span class="avatar" style="background:${autor.avatarBg||"#004BA5"}">${DB.iniciais(autor.nome)}</span>`
      : `<span class="avatar" style="background:var(--creme-2);color:var(--tinta-45)">?</span>`;
    const podeExcluir = me && (me.papel==="Administrador" || a.autorId===me.id);
    return `<div class="mural-item ${a.fixado?"fixado":""}">
      ${avatar}
      <div class="mural-body">
        <div class="mural-hd">
          <b>${autor?DB.esc(autor.nome):"Alguém da equipe"}</b>
          ${a.fixado?'<span class="tagchip">📌 Fixado</span>':""}
          <time>${DB.timeAgo(a.criadoEm)}</time>
        </div>
        <p>${DB.esc(a.texto)}</p>
      </div>
      ${podeExcluir?`<button class="mural-del" data-delaviso="${a.id}" title="Remover aviso" aria-label="Remover aviso">×</button>`:""}
    </div>`;
  }).join("");
  el.querySelectorAll("[data-delaviso]").forEach(btn=>{
    btn.onclick = ()=>{ DB.deleteAviso(btn.dataset.delaviso); renderMuralList(); };
  });
}

function saudacao(){
  const h = new Date().getHours();
  return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
}

function renderDashboard(){
  const me = DB.currentUser();
  const primeiroNome = (me && me.nome ? me.nome.split(" ")[0] : "");
  document.getElementById("pageHd").innerHTML = `
    <h1>${saudacao()}${primeiroNome?`, ${DB.esc(primeiroNome)}`:""}</h1>
    <p>Acompanhe o funil, os próximos contatos e a atividade da equipe.</p>`;

  renderMuralForm();
  renderMuralList();

  const s = DB.dashboardStats();
  const pct = (v)=> s.total ? Math.round((v/s.total)*100) : 0;

  // cartão de "saldo": valor em negociação + atalhos + as 3 frentes
  const frentes = PRODUTOS.map(p=>{
    const leads = DB.getLeadsByProduto(p.key);
    const abertos = leads.filter(l=> l.estagio!=="perdido" && l.estagio!==p.ganho).length;
    return `<a class="frente" href="${p.href}">
      <span class="nm"><i style="background:${p.cor}"></i>${p.label}</span>
      <b>${abertos}</b>
      <small>em aberto · ${leads.length} no total</small>
    </a>`;
  }).join("");
  document.getElementById("saldo").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span class="lbl">Valor em negociação</span><span class="badge neutro">BRL</span>
    </div>
    <div class="big">${DB.formatBRL(s.valorEmAberto)}</div>
    <div class="linha-chip"><span class="chip">↑ ${s.novos7d}</span> novos leads nos últimos 7 dias</div>
    <div class="acoes">
      <button class="btn dark" id="btnSaldoNovo">+ Novo lead</button>
      <a class="btn soft" href="contatos.html">Contatos</a>
    </div>
    <div class="inner-box">
      <div class="frentes-hd">Pipelines <span>| 3 frentes</span></div>
      <div class="frentes">${frentes}</div>
    </div>`;
  document.getElementById("btnSaldoNovo").onclick = ()=> window.SoluaNewLead.open({onCreated: renderDashboard});

  document.getElementById("kpis").innerHTML = `
    <div class="kpi accent"><span class="kpi-ico">${KPI_ICOS.funil}</span><span class="lbl">Leads no funil</span><b>${s.abertos}</b><span class="delta"><span class="chip">${pct(s.abertos)}%</span> da base</span></div>
    <div class="kpi"><span class="kpi-ico">${KPI_ICOS.check}</span><span class="lbl">Fechados</span><b>${s.ganhos}</b><span class="delta"><span class="chip">↑ ${s.taxaConversao}%</span> conversão</span></div>
    <div class="kpi"><span class="kpi-ico">${KPI_ICOS.xis}</span><span class="lbl">Perdidos</span><b>${s.perdidos}</b><span class="delta"><span class="chip baixa">${pct(s.perdidos)}%</span> da base</span></div>
    <div class="kpi"><span class="kpi-ico">${KPI_ICOS.novo}</span><span class="lbl">Novos leads</span><b>${s.novos7d}</b><span class="delta"><span class="chip neutro">7 dias</span> de ${s.total} na base</span></div>
  `;

  // trilho hachurado = o que falta pra 100% da base (como o "limite" da referência)
  document.getElementById("splitBars").innerHTML = PRODUTOS.map(p=>{
    const valor = s[p.key];
    return `<div class="bc-row">
      <div class="bc-hd">
        <span class="bc-name">${p.label}</span>
        <span class="bc-nums"><b>${valor}</b><span class="bc-pct">${pct(valor)}% da base</span></span>
      </div>
      <div class="bc-track hach"><div class="bc-fill" style="width:${pct(valor)}%;background:${p.cor}"></div></div>
    </div>`;
  }).join("");

  renderFeed();
  renderAgenda();
  renderTrend();
}

// ---------- Atividade recente (tabela com busca e filtro por tipo) ----------
function renderFeed(){
  const termo = (document.getElementById("feedBusca").value||"").trim().toLowerCase();
  const tipo = document.getElementById("feedFiltro").value;
  const itens = DB.getActivity(80).filter(a=>{
    if(tipo && a.tipo!==tipo) return false;
    if(!termo) return true;
    const u = usuarioPara(a);
    return (a.descricao||"").toLowerCase().includes(termo) || (u && u.nome.toLowerCase().includes(termo));
  }).slice(0, 8);
  const el = document.getElementById("feed");
  if(!itens.length){
    el.innerHTML = `<tr><td colspan="4" style="cursor:default"><div class="empty" style="padding:26px 10px">${window.SoluaUI.emptyState(termo||tipo ? "Nenhuma atividade com esse filtro." : "Sem atividade ainda.")}</div></td></tr>`;
    return;
  }
  el.innerHTML = itens.map(a=>{
    const u = usuarioPara(a);
    const t = TIPO_ATIV[a.tipo] || {label:a.tipo, cls:"cinza"};
    return `<tr ${a.leadId && DB.getLead(a.leadId) ? `data-leadid="${a.leadId}"` : `style="cursor:default"`}>
      <td><div class="namecell">${avatarPara(a)}<b>${u ? DB.esc(u.nome.split(" ")[0]) : "Sistema"}</b></div></td>
      <td>${DB.esc(a.descricao)}</td>
      <td><span class="dotst ${t.cls}"><span>${t.label}</span></span></td>
      <td style="white-space:nowrap"><b style="font-weight:600;font-size:13px">${DB.timeAgo(a.data)}</b><div style="font-size:11.5px;color:var(--tinta-45)">${DB.formatDateTime(a.data)}</div></td>
    </tr>`;
  }).join("");
  el.querySelectorAll("[data-leadid]").forEach(row=>{
    row.onclick = ()=> window.SoluaLead && window.SoluaLead.open(row.dataset.leadid, {onChange: renderDashboard});
  });
}
document.getElementById("feedBusca").addEventListener("input", renderFeed);
document.getElementById("feedFiltro").addEventListener("change", renderFeed);

// ---------- Próximos contatos (agenda real, a partir do campo
// "proximoContato" de cada lead — nada decorativo/inventado) ----------
const PRODUTO_BADGE = {seguro:"seguro", consorcio:"consorcio", imovel:"imovel"};
const PRODUTO_NOME = {seguro:"Seguro", consorcio:"Consórcio", imovel:"Imóvel"};
function parseDataLocal(dateStr){ return new Date(dateStr+"T12:00:00"); }
function agendaRotulo(dateStr){
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const d = parseDataLocal(dateStr);
  const diffDias = Math.round((d-hoje)/86400000);
  if(diffDias < 0) return {texto:`Atrasado · ${Math.abs(diffDias)}d`, tom:"atrasado"};
  if(diffDias === 0) return {texto:"Hoje", tom:"hoje"};
  if(diffDias === 1) return {texto:"Amanhã", tom:"prox"};
  return {texto: d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}), tom:"prox"};
}
function renderAgenda(){
  const itens = DB.getProximosContatos(8);
  const el = document.getElementById("agenda");
  if(!itens.length){ el.innerHTML = `<div class="empty" style="padding:20px 10px">${window.SoluaUI.emptyState("Nenhum contato agendado. Marque a data em “Próximo contato” no lead.")}</div>`; return; }
  el.innerHTML = itens.map(l=>{
    const r = agendaRotulo(l.proximoContato);
    return `<div class="agenda-row" data-leadid="${l.id}">
      <span class="ag-tag ag-${r.tom}">${r.texto}</span>
      <span class="ag-nome">${DB.esc(l.nome)}</span>
      <span class="badge ${PRODUTO_BADGE[l.produto]||""}">${PRODUTO_NOME[l.produto]||l.produto}</span>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-leadid]").forEach(row=>{
    row.onclick = ()=> window.SoluaLead && window.SoluaLead.open(row.dataset.leadid, {onChange: renderDashboard});
  });
}

// ---------- Novos leads por dia e por produto (14 dias, barras empilhadas) ----------
function renderTrend(){
  const dias = 14;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const buckets = [];
  for(let i=dias-1;i>=0;i--){
    const d = new Date(hoje); d.setDate(d.getDate()-i);
    buckets.push({data:d, imovel:0, seguro:0, consorcio:0, total:0});
  }
  DB.getLeads().forEach(l=>{
    const c = new Date(l.criadoEm); c.setHours(0,0,0,0);
    const b = buckets.find(bk=> bk.data.getTime()===c.getTime());
    if(b && b[l.produto]!=null){ b[l.produto]++; b.total++; }
  });
  const totalPeriodo = buckets.reduce((a,b)=>a+b.total,0);
  const legenda = PRODUTOS.map(p=>
    `<span><i class="${p.hach?"hach":""}" style="${p.hach?`color:${p.cor}`:`background:${p.cor}`}"></i>${p.label}</span>`).join("");
  const el = document.getElementById("trendChart");
  el.innerHTML = `
    <div class="stack-hd"><b>${totalPeriodo} novo${totalPeriodo===1?"":"s"} no período</b><div class="legenda">${legenda}</div></div>
    <div class="stack-wrap" id="stackWrap"><div class="stack-tip" id="stackTip"></div></div>`;
  trendBuckets = buckets;
  desenharTrend();
}

// desenha no tamanho real (px) do espaço disponível — texto nítido e o
// gráfico ocupa o cartão inteiro, sem esticar; redesenha ao redimensionar
let trendBuckets = [];
function desenharTrend(){
  const wrap = document.getElementById("stackWrap");
  if(!wrap) return;
  const buckets = trendBuckets, dias = buckets.length;
  const totalPeriodo = buckets.reduce((a,b)=>a+b.total,0);
  const maxDia = Math.max(...buckets.map(b=>b.total), 1);
  const passo = Math.max(1, Math.ceil(maxDia/4));
  const yMax = passo*4;

  const W = Math.max(240, wrap.clientWidth), H = Math.max(160, wrap.clientHeight), L = 24, R = 4, T = 8, B = 22;
  const plotH = H-T-B, slot = (W-L-R)/dias, bw = Math.min(18, slot*.58), GAP = 2, RAIO = 4;
  const y = v => T + plotH - (v/yMax)*plotH;

  const grades = [0,1,2,3,4].map(k=>{
    const v = k*passo, yy = y(v);
    return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--linha)" stroke-dasharray="3 4"/>
      <text x="0" y="${yy+3.5}" font-size="10" fill="var(--tinta-45)">${v}</text>`;
  }).join("");

  // segmento de cima ganha a ponta arredondada; os de baixo ficam retos e
  // presos na base, com 2px de respiro entre um e outro
  const barras = buckets.map((b,i)=>{
    const x0 = L + i*slot + (slot-bw)/2;
    const ativos = PRODUTOS.filter(p=> b[p.key]>0);
    let base = T + plotH, out = "";
    ativos.forEach((p,j)=>{
      const h = (b[p.key]/yMax)*plotH - (j>0?GAP:0);
      const yTop = base - (j>0?GAP:0) - h;
      const fill = p.hach ? "url(#hachCons)" : p.cor;
      if(j===ativos.length-1){
        const r = Math.min(RAIO, h, bw/2);
        out += `<path d="M${x0},${yTop+h} V${yTop+r} Q${x0},${yTop} ${x0+r},${yTop} H${x0+bw-r} Q${x0+bw},${yTop} ${x0+bw},${yTop+r} V${yTop+h} Z" fill="${fill}"/>`;
      } else {
        out += `<rect x="${x0}" y="${yTop}" width="${bw}" height="${h}" fill="${fill}"/>`;
      }
      base = yTop;
    });
    const rotulo = b.data.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
    return out
      + `<text x="${x0+bw/2}" y="${H-6}" font-size="10" fill="var(--tinta-45)" text-anchor="middle">${b.data.getDate()}</text>`
      + `<rect class="hit" data-i="${i}" x="${L+i*slot}" y="${T}" width="${slot}" height="${plotH}" fill="transparent"><title>${rotulo}: ${b.total} lead${b.total===1?"":"s"}</title></rect>`;
  }).join("");

  const tip = document.getElementById("stackTip");
  const velho = wrap.querySelector("svg"); if(velho) velho.remove();
  wrap.insertAdjacentHTML("afterbegin", `
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Novos leads por dia e por produto nos últimos 14 dias — ${totalPeriodo} no total">
      <defs><pattern id="hachCons" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="var(--amarelo)" opacity=".3"/><rect width="3" height="6" fill="var(--amarelo)"/>
      </pattern></defs>
      ${grades}${barras}
    </svg>`);

  wrap.querySelectorAll(".hit").forEach(hit=>{
    hit.addEventListener("mouseenter", ()=>{
      const i = +hit.dataset.i, b = buckets[i];
      tip.innerHTML = `<b>${b.data.toLocaleDateString("pt-BR",{weekday:"short", day:"2-digit", month:"2-digit"})}</b>`
        + PRODUTOS.map(p=>`<div class="r"><i style="background:${p.cor}"></i>${p.label}<em>${b[p.key]}</em></div>`).join("")
        + `<div class="r" style="margin-top:3px;opacity:.75">Total<em>${b.total}</em></div>`;
      // mantém o balão dentro do cartão, mesmo nas barras das pontas
      const meia = tip.offsetWidth/2;
      const cx = Math.min(Math.max(L + i*slot + slot/2, meia), W - meia);
      tip.style.left = cx+"px";
      tip.style.top = Math.max(y(b.total), tip.offsetHeight - 30)+"px";
      tip.classList.add("on");
    });
    hit.addEventListener("mouseleave", ()=> tip.classList.remove("on"));
  });
}
let trendResize;
addEventListener("resize", ()=>{ clearTimeout(trendResize); trendResize = setTimeout(desenharTrend, 120); });
renderDashboard();

// a topbar cria o botão "+ Novo lead" de forma genérica (crm-ui.js); aqui religamos
// para que, depois de criar, os números e a atividade recente desta página se atualizem.
const btnNovo = document.getElementById("btnNovoLead");
if(btnNovo) btnNovo.onclick = ()=> window.SoluaNewLead.open({onCreated: renderDashboard});

</script>
