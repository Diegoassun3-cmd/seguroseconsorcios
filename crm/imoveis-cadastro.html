<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de imóveis — CRM Solua</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23004BA5'/></svg>">
<link rel="preload" href="../assets/fonts/Nyata-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/crm.css">
<script defer src="../assets/js/branding.js"></script>
</head>
<body data-base="./" data-active="imoveis-cadastro" data-title="Cadastro de imóveis" data-crumbs="Catálogo, fotos e anúncios do site">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="kpis" id="imKpis"></div>

      <div class="card">
        <div class="card-hd">
          <div><h3>Catálogo</h3><p class="sub" id="imSub"></p></div>
          <div class="card-tools">
            <label class="card-search"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17 17l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="imBusca" placeholder="Código, título ou bairro"></label>
            <select class="card-select" id="imFinalidade" aria-label="Filtrar por finalidade">
              <option value="">Venda e locação</option>
              <option value="venda">Venda</option>
              <option value="locacao">Locação</option>
            </select>
            <select class="card-select" id="imPub" aria-label="Filtrar por publicação">
              <option value="">Todos</option>
              <option value="pub">Publicados</option>
              <option value="nao">Não publicados</option>
              <option value="dest">Em destaque</option>
            </select>
            <div class="seg" id="imVista" role="group" aria-label="Modo de exibição">
              <button type="button" data-v="grade" class="on">Grade</button>
              <button type="button" data-v="lista">Lista</button>
            </div>
            <a class="btn dark" href="imovel-editor.html" style="height:40px;padding:0 18px;font-size:13px">+ Cadastrar imóvel</a>
          </div>
        </div>
        <div class="card-bd" id="imLista"></div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/crm-data.js"></script>
<script src="../assets/js/crm-ui.js"></script>
<script src="../assets/js/midia-store.js"></script>
<script src="../assets/js/crm-imovel-comum.js"></script>
<script src="../assets/js/crm-imoveis.js"></script>
<script src="../assets/js/crm-newlead.js"></script>
</body>
</html>
